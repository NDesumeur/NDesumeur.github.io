<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="anime.css">
    <title> </title>
</head>
<body>
    <div class="container">
        <h2> </h2>
        <img src="images_Animes/.jpg" alt="Image de l'anime">
        <div class="info-box">
            <div class="rating">
                /10
            </div>
            <p>Lien de l'anime : <a href="https://anime-sama.to/catalogue//"> </a></p>
            <p>Genres : <span class="genre-info"></span></p>
            <p>Nombre d'épisodes : <span class="episode-info"> </span> <br> Nombre de saisons : <span class="episode-info"> </span></p>
            <p>Statut : <span class="status-info"> </span> <br> Date de diffusion : <span class="date-info"> </span></p>
            <p>Opening : <span class="opening-info"> /10</span> <br> Ending : <span class="ending-info"> /10</span></p>
            <p>Date de la critique : <span class="date-info"> </span></p>
        </div>
        <div class="review-box">
            <p class="title">Note de l'anime</p>
            <p></p>
            <p class="title">Synopsis</p>
            <p></p>
        </div>
        <p><a href="../accueil_critique_anime.html">Revenir à la page d'accueil</a></p>

        <script src="review-theme.js"></script>
    </div>
</body>
</html>
