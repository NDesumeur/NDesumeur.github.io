    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #f4f4f4;
            line-height: 1.6; 
        }

        .container {
            width: 90%; 
            margin: 0 auto;
            padding-top: 50px;
            padding: 20px; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
        }
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 1px;
            color: #ffa500;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            text-align: center;
            margin-top: 1px;
            font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        }

        p {
            font-size: 20px; 
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-top: 10px; 
            border: none;
            border-radius: 25px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            font-size: 16px;
            outline: none;
            background-color: #222;
            color: #f4f4f4;
        }

        input[type="text"]::placeholder {
            color: #999;
        }

        input[type="submit"],
        .button {
            width: 100%;
            padding: 14px 0;
            background-color: #ffa500;
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px; 
        }

        input[type="submit"]:hover,
        .button:hover {
            background-color: #ff8200;
        }

        .error-message {
            color: red;
            margin-top: 10px;
        }

        .autocomplete {
            position: relative;
            width: 75%;
            margin: 0% 10% 24px 10%;
        }

        .autocomplete-items {
            margin-top: 20px;
            margin-left: 0;
            position: relative;
            border: 1px solid #d4d4d4;
            border-radius: 10px;
            background-color: #222;
            z-index: 99;
            width: 100%;
            max-height: 150px;
            box-shadow: 0 0 30px #ffa500;
            overflow-y: auto;
            opacity: 0;
            transition: opacity 0.8s ease;

            

        }
        .autocomplete-items::-webkit-scrollbar {
    width: 0px; 
}


        .autocomplete-items.show {
            opacity: 1;
        }

        .autocomplete-item {
            cursor: pointer;
            color: #f4f4f4;
            display: grid;
            grid-template-columns: 120px minmax(0, 1fr);
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #423c3c;
            transition: box-shadow 0.3s, transform 0.3s;
            padding: 12px 18px 12px 14px;
            width: 100%;
            box-sizing: border-box;
        }

        .autocomplete-item:hover {
            background-color: #383333;
            color: #ffa500;
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.6);
        }

        .content-type {
            display: inline-flex;
            align-items: center;
            margin-bottom: 8px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(255, 191, 64, 0.12);
            border: 1px solid rgba(255, 191, 64, 0.28);
            color: #ffdd87;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .content-type img {
            width: 16px;
            height: 16px;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item img {
            width: 100px;
            height: 66px;
            object-fit: contain;
            flex: 0 0 100px;
            border-radius: 8px;
            background-color: #111;
            padding: 0;
            margin-left: 0;
        }
        .anime-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 0;
            width: 100%;
        }

        .anime-title {
            display: flex;
            align-items: center;
            font-size: 24px;
            color: #ffa500;
            font-weight: bold;
        }

        .rating,.genre {
            font-size: 18px;
            color: #00ff00;
            display: flex;
            align-items: center;
            font-weight: bold;
            text-align: center;
        }



        @media (max-width: 768px) {
            .container {
                max-width: 90%;
            }

            h1 {
                font-size: 36px;
            }

            .logo {
                width: 80px;
            }
            .rating, .genre {
                font-size: 14px;
            }

            .anime-title {
                font-size: 18px;
            }
        }

    </style>
</head>

        var animeInput = document.getElementById("animeInput");
        var autocompleteItems = document.getElementById("autocompleteItems");

        function getAnimeSlug(name) {
            return String(name || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        function getAnimeType(anime) {
            if (anime.type) {
                return anime.type;
            }

            var filmSlugs = {
                'after-the-rain': true,
                'eve-no-jikan': true,
                'fireworks': true,
                'hal': true,
                'mind-game': true,
                'princesse-mononoke': true,
                'wolf-children': true
            };

            return filmSlugs[getAnimeSlug(anime.name)] ? 'film' : 'anime';
        }

        animeInput.addEventListener("input", function() {
            var input = this.value.trim().toLowerCase();
            var suggestions = animeList.filter(function(anime) {
                return anime.name.toLowerCase().startsWith(input);
            });
            if (input) {
                autocompleteItems.innerHTML = "";
                suggestions.slice(0, 5).forEach(function(anime) {
                    var type = getAnimeType(anime);
                    var item = document.createElement("div");
                    item.classList.add("autocomplete-item");

                    var image = document.createElement("img");
                    image.src = "anime_critiques/images_Animes/" + anime.image;
                    image.alt = "Image de " + anime.name;

                    var animeInfo = document.createElement("div");
                    animeInfo.classList.add("anime-info");

                    var contentType = document.createElement("div");
                    contentType.classList.add("content-type");
                    contentType.textContent = type === 'film' ? 'Film' : 'Anime';

                    var animeTitle = document.createElement("div");
                    animeTitle.classList.add("anime-title");
                    animeTitle.textContent = anime.name;

                    var rating = document.createElement("div");
                    rating.classList.add("rating");
                    rating.textContent = "Note: " + anime.rating;

                    var genre = document.createElement("div");
                    genre.classList.add("genre");
                    genre.textContent = anime.genre;

                    animeInfo.appendChild(contentType);
                    animeInfo.appendChild(animeTitle);
                    animeInfo.appendChild(rating);
                    animeInfo.appendChild(genre);

                    item.appendChild(image);
                    item.appendChild(animeInfo);

                    item.addEventListener("click", function() {
                        animeInput.value = anime.name;
                        autocompleteItems.style.display = "none";
                    });

                    autocompleteItems.appendChild(item);
                });
                autocompleteItems.classList.add("show"); 
            } else {
                autocompleteItems.innerHTML = ""; 
                autocompleteItems.classList.remove("show");
            }
            autocompleteItems.style.display = input ? "block" : "none"; 
            
        });


        document.getElementById("searchForm").addEventListener("submit", function(event) {
            event.preventDefault();

            var animeName = document.getElementById("animeInput").value.trim().toLowerCase();
            if (animeName) {
                var matchedAnime = animeList.find(function(anime) {
                    return anime.name.toLowerCase() === animeName;
                }) || animeList.find(function(anime) {
                    return anime.name.toLowerCase().startsWith(animeName);
                });

                if (matchedAnime) {
                    var url = "anime_critiques/" + matchedAnime.name.toLowerCase().replace(/\s+/g, '-') + ".html";
                    window.location.href = url;
                } else {
                    window.location.href = "notfound.html";
                }
            } else {
                document.getElementById("errorMessage").style.display = "block";
            }
        });

        function playAudioAndRedirect() {
            var audio = document.getElementById("audio");
            audio.play();
            
            setTimeout(function() {
                window.location.href = "pagecachee.html";
            }, 4500);
        }
        function goToRandomAnime() {
            var randomIndex = Math.floor(Math.random() * animeList.length);
            var randomAnime = animeList[randomIndex];
            var url = "anime_critiques/" + randomAnime.name.toLowerCase().replace(/\s+/g, '-') + ".html";
            window.location.href = url;
        }
